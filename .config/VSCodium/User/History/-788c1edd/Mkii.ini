;
; This file compile all
; modules used in this bar

; Powermenu

[module/power]
type = custom/text

click-left = powermenu
content = 

content-background = ${colors.urgent}
content-foreground = ${colors.nord6}

; Network

; Wifi module from : https://github.com/BobdaProgrammer/nord-doWM/

[module/wifi]
type = internal/network
interface = wlan0
format-connected = <ramp-signal> <label-connected>
format-connected-background=${colors.BACKGROUND}
format-disconnected = 󰖪
format-disconnected-background=${colors.BACKGROUND}
label-connected = "%essid% "
ramp-signal-0 = 󰖪 
ramp-signal-1 = 󰤯 
ramp-signal-2 = 󰤟 
ramp-signal-3 = 󰤢 
ramp-signal-4 = 󰤥 
ramp-signal-5 = 󰤨 
ramp-signal-foreground = ${colors.ALTYELLOW}
interval = 5

; Desktop

[module/xworkspaces]
type = internal/xworkspaces
label-active = 
label-active-background = ${colors.background}
label-active-padding = 1

label-occupied = 
label-occupied-background = ${colors.background}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.background}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.background}
label-empty-padding = 1

; Time & Date

[module/time]
type = internal/date
interval = 1

date = %a %d %b %H:%M
label =%date% 
label-foreground = ${gruvbox.cream}
label-padding-left=1

; Battery

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = ADP1
poll-interval = 5
time-format = %H:%M

format-charging =  <animation-charging><label-charging>
format-charging-foreground = ${gruvbox.yellow}
format-charging-underline = ${gruvbox.yellow}
label-charging = %percentage%%
label-charging-foreground = ${gruvbox.cream}
label-charging-padding = 1

format-discharging = <ramp-capacity><label-discharging>
format-discharging-foreground = ${gruvbox.yellow}
format-discharging-underline = ${gruvbox.yellow}
label-discharging = %percentage%%
label-discharging-foreground = ${gruvbox.cream}
label-discharging-underline = ${gruvbox.yellow}
label-discharging-padding = 1

format-full-prefix = ""
format-full-foreground = ${gruvbox.yellow}
format-full-underline = ${gruvbox.yellow}
label-full = %percentage%%
label-full-foreground = ${gruvbox.cream}
label-full-underline= ${gruvbox.yellow}
label-full-padding = 1

label-low = BATTERY LOW %percentage%%
label-low-foreground = ${gruvbox.red-alt}
label-low-underline= ${gruvbox.red-alt}
label-low-padding = 1

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-5 = 
ramp-capacity-6 = 
ramp-capacity-7 = 
ramp-capacity-8 = 
ramp-capacity-9 = 
ramp-capacity-padding = 1 

ramp-capacity-0-foreground = ${gruvbox.red-alt}
ramp-capacity-0-underline = ${gruvbox.red-alt}

; Only applies if <bar-capacity> is used
bar-capacity-width = 10

; Only applies if <animation-charging> is used
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-5 = 
animation-charging-6 = 
animation-charging-framerate = 750

; Only applies if <animation-discharging> is used
animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
animation-discharging-5 = 
animation-discharging-6 = 
animation-discharging-framerate = 500

animation-low-0 = !
animation-low-1 = !!
animation-low-framerate = 200

; Sound
