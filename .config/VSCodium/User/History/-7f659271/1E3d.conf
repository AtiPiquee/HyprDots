# ----------------------------- KEYBOARD CONFIGS -------------------------------- #
$keyboardlayout = fr
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/colors.conf

# -----------------------------------------------------
# Monitor setup
# -----------------------------------------------------

monitor = eDP-1, 1366x768@60, 0x0, 1

# ----------------------------------------------------- 
# Environment Variables
# ----------------------------------------------------- 

env = WLR_NO_HARDWARE_CURSORS, 1
env = WLR_RENDERER_ALLOW_SOFTWARE, 1
env = XCURSOR_SIZE,15N
env = GTK_THEME,Adwaita:dark

# ----------------------------------------------------- 
# Autostart
# ----------------------------------------------------- 

exec-once = dunst
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = ~/.config/waybar/launch.sh

# -----------------------------------------------------
# Wallpaper
# -----------------------------------------------------

exec-once = swww-daemon
exec-once = swww img -o eDP-1 --transition-type wipe --transition-angle 30 --transition-step 90 /home/atipique/.config/wallpapers.jpg

# ----------------------------------------------------- 
# Keyboard layout and mouse
# ----------------------------------------------------- 

input {
    kb_variant = 
    kb_layout = fr 
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}


# ----------------------------------------------------- 
# General window layout and colors
# ----------------------------------------------------- 

general {
    gaps_in = 6
    gaps_out = 6
    border_size = 2
    col.active_border = rgb($foreground)
    col.inactive_border = rgb($background)
    layout = dwindle
}

# ----------------------------------------------------- 
# General window decoration
# ----------------------------------------------------- 

decoration {
    rounding = 5
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = on
        ignore_opacity = true
        xray = true
        # blurls = waybar
    }
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
}

# ----------------------------------------------------- 
# Layouts
# ----------------------------------------------------- 

dwindle {
    pseudotile = true
    preserve_split = true
}

gestures {
    workspace_swipe = false
}


# ----------------------------------------------------- 
# Misc settings
# ----------------------------------------------------- 

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ----------------------------------------------------- 
# Animations
# ----------------------------------------------------- 
animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

# ----------------------------------------------------- 
# Animations
# ----------------------------------------------------- 
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}


# ----------------------------------------------------- 
# Window rules
# ----------------------------------------------------- 

