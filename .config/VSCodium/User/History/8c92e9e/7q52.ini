[module/menu]
type    = custom/text

content            = 
content-foreground = ${colors.blue}
content-padding    = 1

click-left         = rofi -show drun
click-right        = rofi -show window

[module/i3]
type = internal/i3

format = <label-state> <label-mode>

enable-click = false
enable-scroll = false

label-focused = 
label-focused-background = ${colors.bg}
label-focused-foreground = ${colors.fg}
label-focused-padding = 2

label-occupied = 
label-occupied-background = ${colors.bg}
label-occupied-foreground = ${colors.yellow}
label-occupied-padding = 2

label-empty = 
label-empty-background = ${colors.bg}
label-empty-foreground = ${colors.fg}
label-empty-padding = 2


[module/date]
type = internal/date
interval = 5
;format-background = ${colors.nord1}
label-foreground = ${colors.white}
time     = %I:%M %p
date ="%d %B %Y"
label    = %date%

[module/time]
type = internal/date
interval = 1.0
;format-background = ${colors.nord1}
label-foreground = ${colors.white}
time = %H:%M 
label    = %time%

[module/blt]
type = custom/script
exec = ~/.config/polybar/sblt
format-foreground     = ${colors.blue}
click-left = opdrofi
interval = 1


[module/pulseaudio]
type = internal/pulseaudio
sink = alsa_output.pci-0000_12_00.3.analog-stereo
use-ui-max = false
interval = 5
format-volume            = <ramp-volume><label-volume>
format-volume-foreground = ${colors.green}
label-volume             = %percentage%%
label-volume-padding     = 1

format-muted-foreground     = ${colors.bg-red}
format-muted-prefix         = ﱝ
format-muted-prefix-padding = 1
label-muted                 = Muted
label-muted-padding         = ${self.label-volume-padding}

ramp-volume-0 = 奄
ramp-volume-1 = 奄
ramp-volume-2 = 奔
ramp-volume-3 = 奔
ramp-volume-4 = 墳
ramp-volume-5 = 墳
ramp-volume-6 = 墳
ramp-volume-padding = 1

content-background = ${colors.black}   

[module/battery]
type = internal/battery

full-at = 99
battery = BAT0
adapter = AC

poll-interval = 2
time-format = %H:%M

format-charging            = <animation-charging><label-charging>
format-charging-foreground = ${colors.yellow}
label-charging             = %percentage%%
label-charging-padding     = 1
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-5 = 
animation-charging-6 = 
animation-charging-padding   = 1
animation-charging-framerate = 750

format-discharging            = <ramp-capacity><label-discharging>
format-discharging-foreground = ${self.format-charging-foreground}
label-discharging             = ${self.label-charging}
label-discharging-padding     = ${self.label-charging-padding}
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-5 = 
ramp-capacity-6 = 
ramp-capacity-7 = 
ramp-capacity-8 = 
ramp-capacity-9 = 
ramp-capacity-padding = 1

format-full                = <label-full>
format-full-foreground     = ${self.format-charging-foreground}
format-full-prefix         = 
format-full-prefix-padding = 1
label-full                 = ${self.label-charging}
label-full-padding         = ${self.label-charging-padding}

[module/xworkspaces]
type = internal/xworkspaces
label-active = 
label-active-background = ${colors.bg-darker}
label-active-padding = 1

label-occupied = 
label-occupied-background = ${colors.bg-darker}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.bg-darker}
label-empty-padding = 1

# Modules from https://github.com/astonish-g/i3-everforest-dotfiles

[padding]
modules = 20px

[module/usdrate]
format = <label>
label = %{F#dbbc7f}%{F#F3F5D9}  %output%
type = custom/script
exec = "python ~/.config/polybar/scripts/polybar-xo-currency.py try usd"
interval=600
label-padding-left = ${padding.modules}
label-font = 5

[module/eurrate]
format = <label>
label = %{F#dbbc7f}%{F#F3F5D9}  %output%
type = custom/script
exec = "python ~/.config/polybar/scripts/currency.py try eur"
interval=600
label-padding-left = ${padding.modules}
label-font = 5

[module/battery1]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = ADP1
poll-interval = 5
time-format = %H:%M

format-charging =  <animation-charging><label-charging>
format-charging-foreground = ${gruvbox.yellow}
format-charging-underline = ${gruvbox.yellow}
label-charging = %percentage%%
label-charging-foreground = ${gruvbox.cream}
label-charging-padding= 1
label-charging-padding-left = 1

format-discharging = <ramp-capacity><label-discharging>
format-discharging-foreground = ${gruvbox.yellow}
format-discharging-underline = ${gruvbox.yellow}
label-discharging = %percentage%%
label-discharging-foreground = ${gruvbox.cream}
label-discharging-underline = ${gruvbox.yellow}
label-discharging-padding= 1

format-full-prefix = ""
format-full-foreground = ${gruvbox.yellow}
format-full-underline = ${gruvbox.yellow}
label-full = %percentage%%
label-full-foreground = ${gruvbox.cream}
label-full-underline= ${gruvbox.yellow}
label-full-padding = 1

label-low = BATTERY LOW %percentage%%
label-low-foreground = ${gruvbox.red-alt}
label-low-underline= ${gruvbox.red-alt}
label-low-padding = 2

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

ramp-capacity-0-foreground = ${gruvbox.red-alt}
ramp-capacity-0-underline = ${gruvbox.red-alt}

; Only applies if <bar-capacity> is used
bar-capacity-width = 10

; Only applies if <animation-charging> is used
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-5 = 
animation-charging-6 = 
animation-charging-framerate = 750

; Only applies if <animation-discharging> is used
animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
animation-discharging-5 = 
animation-discharging-6 = 
animation-discharging-framerate = 500

animation-low-0 = !
animation-low-1 = !!
animation-low-framerate = 200

[module/pulseaudio1]
type = internal/pulseaudio

format-volume-prefix = ""
format-volume-prefix-foreground = ${colors.yellow}
format-volume = <label-volume>

label-volume = %percentage%%
;label-volume-padding-right = ${padding.modules}
label-volume-padding-left = 1

label-muted = muted
label-muted-foreground = ${colors.disabled}