
;  void logo

[module/powermenu]
type = custom/menu


expand-right = true

format-spacing = 1

label-open = " "
label-open-foreground = ${colors.yellow}
label-open-background = ${colors.nord7}
label-close = cancel
label-close-foreground = ${colors.function}
label-close-background = ${colors.nord7}
label-separator = |
label-separator-foreground = ${colors.foreground}
label-separator-background = ${colors.nord7}

;Powermenu
menu-0-0 = "Reboot "
menu-0-0-exec = menu-open-1
menu-0-0-foreground = ${colors.urgent}
menu-0-0-background = ${colors.nord7}

menu-0-1 = "Power Off"
menu-0-1-exec = menu-open-2
menu-0-1-foreground = ${colors.urgent}
menu-0-1-background = ${colors.nord7}

;Reboot
menu-1-0 = "Cancel "
menu-1-0-exec = menu-open-0
menu-1-0-foreground = ${colors.success}
menu-1-1 = "Reboot"
menu-1-1-exec = reboot
menu-1-1-foreground = ${colors.urgent}
menu-1-1-background = ${colors.nord7}

;Shutdown
menu-2-0 = "Power off"
menu-2-0-exec = shutdown
menu-2-0-foreground = ${colors.urgent}
menu-2-1 = "Cancel "
menu-2-1-exec = menu-open-0
menu-2-1-foreground = ${colors.success}
menu-2-1-background = ${colors.nord7}

[module/time]
type = internal/date
interval = 1

date = %a %d %b %H:%M
label =%date% 
label-foreground = ${gruvbox.cream}
label-padding-left=1

[module/blt]
type = custom/script
exec = ~/.config/polybar/sblt
format-foreground     = ${colors.blue}
click-left = opdrofi
interval = 1   

[module/xworkspaces]
type = internal/xworkspaces
label-active = 
label-active-background = ${colors.nord9}
label-active-padding = 1

label-occupied = 
label-occupied-background = ${colors.nord9}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.nord9}
label-empty-padding = 1

enable-click = false

[module/usdrate]
format = <label>
label = %{F#dbbc7f}%{F#F3F5D9}  %output%
type = custom/script
exec = "python ~/.config/polybar/scripts/polybar-xo-currency.py try usd"
interval=600
label-padding-left = ${padding.modules}
label-font = 5

[module/eurrate]
format = <label>
label = %{F#dbbc7f}%{F#F3F5D9}  %output%
type = custom/script
exec = "python ~/.config/polybar/scripts/currency.py try eur"
interval=600
label-padding-left = ${padding.modules}
label-font = 5

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = ADP1
poll-interval = 5
time-format = %H:%M

format-charging =  <animation-charging><label-charging>
format-charging-foreground = ${gruvbox.yellow}
format-charging-underline = ${gruvbox.yellow}
label-charging = %percentage%%
label-charging-foreground = ${gruvbox.cream}
label-charging-padding = 1

format-discharging = <ramp-capacity><label-discharging>
format-discharging-foreground = ${gruvbox.yellow}
format-discharging-underline = ${gruvbox.yellow}
label-discharging = %percentage%%
label-discharging-foreground = ${gruvbox.cream}
label-discharging-underline = ${gruvbox.yellow}
label-discharging-padding = 1

format-full-prefix = ""
format-full-foreground = ${gruvbox.yellow}
format-full-underline = ${gruvbox.yellow}
label-full = %percentage%%
label-full-foreground = ${gruvbox.cream}
label-full-underline= ${gruvbox.yellow}
label-full-padding = 1

label-low = BATTERY LOW %percentage%%
label-low-foreground = ${gruvbox.red-alt}
label-low-underline= ${gruvbox.red-alt}
label-low-padding = 1

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-5 = 
ramp-capacity-6 = 
ramp-capacity-7 = 
ramp-capacity-8 = 
ramp-capacity-9 = 
ramp-capacity-padding = 1 

ramp-capacity-0-foreground = ${gruvbox.red-alt}
ramp-capacity-0-underline = ${gruvbox.red-alt}

; Only applies if <bar-capacity> is used
bar-capacity-width = 10

; Only applies if <animation-charging> is used
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-5 = 
animation-charging-6 = 
animation-charging-framerate = 750

; Only applies if <animation-discharging> is used
animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
animation-discharging-5 = 
animation-discharging-6 = 
animation-discharging-framerate = 500

animation-low-0 = !
animation-low-1 = !!
animation-low-framerate = 200

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = ""
format-volume-prefix-foreground = ${colors.yellow}
format-volume = <label-volume>

label-volume = %percentage%%
;label-volume-padding-right = ${padding.modules}
label-volume-padding-left = 1

label-muted = muted
label-muted-foreground = ${colors.disabled}
