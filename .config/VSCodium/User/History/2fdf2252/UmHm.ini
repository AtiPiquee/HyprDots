;==============================================
; Polybar nord config
; 
; More on https://gitlab.com/AtiPique/VoidNord
;==============================================

[global/wm]
; Don t forgor to change path when project finished
include-file = $HOME/Dev/polybar/nord.ini
include-file = $HOME/Dev/polybar/modules.ini
include-file = $HOME/Dev/polybar/utils.ini

[bar/main]
width = 100%
height = 20pt

padding-left = 0
padding-right = 0

font-0 = JetbrainsMono Nerd Font:style=Medium:size=12;2

modules-left	       = power e0b0 
modules-center	       =
modules-right 	       =

cursor-click	       = pointer
cursor-scroll	       = ns-resize

[settings]
wm-restack = i3
screenchange-reload = true
pseudo-transparency = true


