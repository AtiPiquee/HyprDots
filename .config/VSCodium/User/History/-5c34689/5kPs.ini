[global/wm]
include-file = $HOME/.config/polybar/colors.ini
include-file = $HOME/.config/polybar/modules.ini
include-file = $HOME/.config/polybar/utils.ini

[bar/main]

width = 100%
height = 16pt

;dpi = 96

background = #00
foreground = ${colors.buffer}
padding-left = 0 
padding-right = 0
radius-left = 50

font-0 = JetbrainsMono Nerd Font:style=Medium:size=12;2

modules-left    = space-alt powermenu e0b0 xworkspaces e0b0-alt
modules-center  = time
modules-right   = pulseaudio space battery

cursor-click  = pointer
cursor-scroll = ns-resize

enable-ipc = true

[settings]
screenchange-reload = true
pseudo-transparency = true


