$mainMod = SUPER
$mainModShift = SUPER SHIFT
$ShiftMod = SHIFT
$alt = ALT

$menu = tofi-drun --drun-launch=true

# exit hyprland
bind = $mainModShift, K, exec, hyprctl dispatch exit 

# Binds for launching applications
bind = $mainMod, RETURN, exec, kitty
bind = $mainModShift, RETURN, exec, kitty -e fish -c 'fetch; exec fish'
bind = $mainMod, B, exec, firefox
bind = $mainModShift, B, exec, firefox --private-window
bind = $mainMod, D, exec, $menu
bind = $mainMod, V, exec, codium
bind = $mainModShift, S, exec, hyprshot -m region
bind = $mainModShift, W, exec, hyprshot -m window
bind = $mainModShoft, M, exec, hyprshot -m output 
bind = $mainModShift, E, exec, thunar
bind = $alt, W, exec, ~/.local/bin/wallman

# Binds for moving windows
bind = $mainMod, W, killactive
bind = $mainMod, E, fullscreen
bind = $mainMod, J, togglesplit
bind = $mainMod, T, togglefloating
#bind = $mainMod, mouse_scroll_up, layout next
#bind = $mainMod, mouse_scroll_down, layout prev
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Binds for running scripts
bind = $mainModShift, P, exec, ~/.config/waybar/launch.sh

# Binds for changing the workspace
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10
bind = $mainMod ALT, up, workspace, e+1
bind = $mainMod ALT, down, workspace, e-1
bind = $mainModShift, code:10, movetoworkspace, 1
bind = $mainModShift, code:11, movetoworkspace, 2
bind = $mainModShift, code:12, movetoworkspace, 3
bind = $mainModShift, code:13, movetoworkspace, 4
bind = $mainModShift, code:14, movetoworkspace, 5
bind = $mainModShift, code:15, movetoworkspace, 6
bind = $mainModShift, code:16, movetoworkspace, 7
bind = $mainModShift, code:17, movetoworkspace, 8
bind = $mainModShift, code:18, movetoworkspace, 9
bind = $mainModShift, code:19, movetoworkspace, 10

# Mouse binds to move windows and change workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainModShift, right, resizeactive, 100 0
bind = $mainModShift, left, resizeactive, -100 0
bind = $mainModShift, up, resizeactive, 0 -100
bind = $mainModShift, down, resizeactive, 0 100

